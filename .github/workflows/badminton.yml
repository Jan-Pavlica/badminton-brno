name: scrape-and-deploy

on:
  schedule:
    - cron: "7/15 * * * *"   # každých 15 min, posunuté mimo začátek hodiny kvůli GH Actions špičkám
  workflow_dispatch:           # manuální spuštění z UI pro testy
  push:
    branches: [main]
    paths:
      - "src/**"
      - "templates/**"
      - ".github/workflows/badminton.yml"

permissions:
  contents: write   # potřeba pro gh-pages push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Actions pinnuté na konkrétní SHA — komentář drží lidsky čitelnou verzi.
      # Aktualizovat přes Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONPATH: src
        run: python -m scraper.main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true   # drží gh-pages branch malý (jen HEAD)
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "scrape ${{ github.run_number }}"
